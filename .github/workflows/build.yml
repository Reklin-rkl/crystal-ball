name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The repository is developed on Windows, where the executable bit of gradlew is not tracked,
      # which makes the Linux runner fail with "permission denied". Setting it here is harmless on
      # every platform and keeps checkouts from other systems working too.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: crystal-ball-jar
          path: build/libs/*.jar
