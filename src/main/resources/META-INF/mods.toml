[[mods]]
modId="crystal_ball"
version="0.35.0-alpha"
displayName="Crystal Ball"
description='''
Watch another player through a crystal ball - without leaving your own body.

Inspired by the Crystal Ball (占卜球) from Terraria: hold the orb, cycle through the other players
and see through their eyes while your own body, game mode, inventory and hitbox stay exactly where
they are.

Features: camera-only remote viewing at any distance, cross dimension viewing (terrain, mobs, items
and other players are streamed), vanilla F5 perspectives, configurable server side and client side
settings, and a /crystalball command tree with per command permission levels.

Compatibility may be poor: the mod changes how the client renders and streams the remote world
(chunk window, view area, entity streaming). Expect incompatibilities with camera / rendering /
chunk mods (for example OptiFine or entity culling mods). Please report bugs, suggest improvements
and port it to other Minecraft versions - contributions, pull requests and forks are welcome.
'''
authors="Reklin, DeepSeek Harness AI"
credits="Inspired by the Crystal Ball from Terraria"

[[dependencies.crystal_ball]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.18.2]"
    ordering="NONE"
    side="BOTH"

[[dependencies.crystal_ball]]
    modId="forge"
    mandatory=true
    versionRange="[40.1.0,)"
    ordering="NONE"
    side="BOTH"